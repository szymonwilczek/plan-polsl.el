name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        emacs-version:
          - 29.4
          - 30.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emacs ${{ matrix.emacs-version }}
        uses: jcs090218/setup-emacs@master
        with:
          version: ${{ matrix.emacs-version }}

      - name: Compile with zero warnings
        run: make compile

      - name: Run tests
        run: make test
